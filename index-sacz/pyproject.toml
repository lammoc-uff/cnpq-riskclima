[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riskclima-sacz"
version = "0.1.0"
description = "South Atlantic Convergence Zone index processing for RiskClima"
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas>=1.0",
    "metpy>=1.6",
    "netcdf4>=1.7",
    "numpy>=1.26,<2",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "requests>=2.32",
    "rioxarray>=0.17",
    "shapely>=2.0",
    "xarray>=2024.5",
    "zarr>=3",
]

[dependency-groups]
dev = [
    "pyrefly>=0.29",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.9",
]

[project.scripts]
riskclima-sacz-process-era5 = "riskclima_sacz.process_sacz_index_era5:main"
riskclima-sacz-index-era5 = "riskclima_sacz.main_sacz_index_era5:main"
riskclima-sacz-process-cmip6 = "riskclima_sacz.process_sacz_index_cmip6:main"
riskclima-sacz-index-cmip6 = "riskclima_sacz.main_sacz_index_cmip6:main"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
extend-exclude = ["**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]

[tool.pyrefly]
project-includes = ["src"]
python-version = "3.12"
search-path = ["src"]
preset = "strict"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["riskclima_sacz"]
